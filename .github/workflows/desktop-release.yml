name: Atrium Desktop Cross-Platform Build

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Optional existing release tag to attach desktop packages (e.g. v0.3.4)
        required: false
        type: string
      include_windows:
        description: Also build and upload the Windows NSIS installer
        required: false
        type: boolean
        default: false
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-mac:
    name: Build Desktop (macOS arm64 + x64)
    runs-on: macos-15-intel
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck Node & Web
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      - name: Build production app
        run: npm run build

      - name: Disable Spotlight indexing on macOS runner
        run: sudo mdutil -a -i off || true

      - name: Package macOS DMG & ZIP (arm64 then x64)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          for arch in arm64 x64; do
            echo "Packaging macOS $arch..."
            npx electron-builder --mac dmg zip --"$arch" --publish never || (sleep 5 && npx electron-builder --mac dmg zip --"$arch" --publish never)
          done

      - name: Upload macOS build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: atrium-desktop-mac
          path: |
            dist/Atrium-*-mac-*.dmg
            dist/Atrium-*-mac-*.zip

      - name: Attach macOS installers to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag != '' && inputs.release_tag || github.ref_name }}
          files: |
            dist/Atrium-*-mac-*.dmg
            dist/Atrium-*-mac-*.zip

  build-linux:
    name: Build Desktop (Linux x64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck Node & Web
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      - name: Build production app
        run: npm run build

      - name: Package Linux AppImage & DEB (x64)
        run: npx electron-builder --linux AppImage deb --x64 --publish never

      - name: Upload Linux build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: atrium-desktop-linux-x64
          path: |
            dist/Atrium-*-linux-*.AppImage
            dist/Atrium-*-linux-*.deb

      - name: Attach Linux installers to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag != '' && inputs.release_tag || github.ref_name }}
          files: |
            dist/Atrium-*-linux-*.AppImage
            dist/Atrium-*-linux-*.deb

  build-win:
    name: Build Desktop (Windows x64)
    if: startsWith(github.ref, 'refs/tags/v') || inputs.include_windows == true
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck Node & Web
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      - name: Build production app
        run: npm run build

      - name: Package Windows NSIS installer
        run: npx electron-builder --win nsis --x64 --publish never

      - name: Upload Windows build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: atrium-desktop-win32-x64
          path: |
            dist/Atrium-Setup-*.exe
            dist/Atrium-Setup-*.exe.blockmap
            dist/latest.yml

      - name: Attach Windows installer to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag != '' && inputs.release_tag || github.ref_name }}
          files: |
            dist/Atrium-Setup-*.exe
            dist/Atrium-Setup-*.exe.blockmap
            dist/latest.yml
